[workspace]
resolver = "2"
members = [
  "crates/metrune-core",
  "crates/metrune-cli",
  "crates/metrune-api",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/cloudant42/metrune"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
clickhouse = "0.13"
dialoguer = "0.12"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
flate2 = "1.0"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
keyring = "4.1.5"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
openidconnect = { version = "4.0.1", features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.12", features = ["serde", "v4"] }
walkdir = "2.5"
