name: Release client

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: metrune-linux-x86_64
            target: x86_64-unknown-linux-gnu
            source: target/x86_64-unknown-linux-gnu/release/metrune
          - os: windows-latest
            artifact: metrune-windows-x86_64.exe
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/metrune.exe
          # macos-13 was retired by GitHub; macos-15-intel is the current
          # Intel macOS runner.
          - os: macos-15-intel
            artifact: metrune-macos-x86_64
            target: x86_64-apple-darwin
            source: target/x86_64-apple-darwin/release/metrune
          - os: macos-14
            artifact: metrune-macos-arm64
            target: aarch64-apple-darwin
            source: target/aarch64-apple-darwin/release/metrune
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build the client
        env:
          # Pinned into the binary so `metrune update` only installs manifests
          # signed by the Metrune release key. Absent on forks, which produce a
          # client that reports updates but refuses to self-install them.
          METRUNE_RELEASE_PUBKEY: ${{ vars.METRUNE_RELEASE_PUBKEY }}
        run: cargo build --release -p metrune --target "${{ matrix.target }}"
      - name: Smoke-test the native binary
        shell: bash
        run: |
          "${{ matrix.source }}" --version
          "${{ matrix.source }}" --help
      - name: Name release artifact
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums and release manifest
        shell: bash
        run: |
          sha256sum artifacts/metrune-* > artifacts/SHA256SUMS
          cat > artifacts/RELEASE_MANIFEST.txt <<EOF
          version: ${GITHUB_REF_NAME}
          commit: ${GITHUB_SHA}
          clients:
            - artifact: metrune-linux-x86_64
              platform: Linux x86_64
              tier: supported
            - artifact: metrune-windows-x86_64.exe
              platform: Windows x86_64
              tier: experimental
            - artifact: metrune-macos-x86_64
              platform: Intel macOS
              tier: experimental
            - artifact: metrune-macos-arm64
              platform: Apple Silicon macOS
              tier: experimental
          EOF
      - name: Build the machine-readable client manifest
        shell: bash
        env:
          # Absent on forks and on releases cut before a key was provisioned;
          # the manifest is then published unsigned and clients that pin a key
          # refuse to auto-install from it.
          METRUNE_RELEASE_SIGNING_KEY: ${{ secrets.METRUNE_RELEASE_SIGNING_KEY }}
          MINIMUM_CLIENT_VERSION: ${{ vars.MINIMUM_CLIENT_VERSION }}
        run: |
          # Generated by the released binary itself, so the manifest can never
          # drift from the format this version's `metrune update` parses.
          chmod +x artifacts/metrune-linux-x86_64
          (cd artifacts && ./metrune-linux-x86_64 release manifest \
            --version "${GITHUB_REF_NAME}" \
            --minimum-version "${MINIMUM_CLIENT_VERSION:-${GITHUB_REF_NAME}}" \
            --checksums SHA256SUMS \
            --upstream-base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --output client-manifest.json)
      - name: Attest release binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/metrune-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
