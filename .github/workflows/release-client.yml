name: Release client

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-client-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # The committed package version is the only place the release number is
  # written. A manual run derives the tag from it and the publish job creates
  # that tag. The operator never types or pushes a version tag, so the tag can
  # never disagree with the shipped binary.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the release tag
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
            [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "manual client releases must run against ${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          package_version="$(bash scripts/resolve-release-version.sh client)"
          tag="client-v${package_version}"
          version="$(bash scripts/check-release-version.sh client "$tag" "$package_version")"
          # Re-releasing an existing version would move a tag that published
          # artifacts and signed manifests already point at. Transport or auth
          # failures also stop the release rather than looking like a 404.
          bash scripts/assert-release-tag-available.sh "$tag"
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Wait for the release commit's CI and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release-checks.py

  build:
    needs: [version, gate]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: metrune-linux-x86_64
            target: x86_64-unknown-linux-gnu
            source: target/x86_64-unknown-linux-gnu/release/metrune
          - os: windows-latest
            artifact: metrune-windows-x86_64.exe
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/metrune.exe
          # macos-13 was retired by GitHub; macos-15-intel is the current
          # Intel macOS runner.
          - os: macos-15-intel
            artifact: metrune-macos-x86_64
            target: x86_64-apple-darwin
            source: target/x86_64-apple-darwin/release/metrune
          - os: macos-14
            artifact: metrune-macos-arm64
            target: aarch64-apple-darwin
            source: target/aarch64-apple-darwin/release/metrune
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build the client
        env:
          # Pinned into the binary so `metrune update` only installs manifests
          # signed by the Metrune release key. Release builds fail closed when
          # the repository variable has not been configured.
          METRUNE_RELEASE_PUBKEY: ${{ vars.METRUNE_RELEASE_PUBKEY }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${METRUNE_RELEASE_PUBKEY}" || {
            echo "METRUNE_RELEASE_PUBKEY must be configured for release builds" >&2
            exit 1
          }
          package_id="$(cargo pkgid -p metrune)"
          package_version="${package_id##*@}"
          bash scripts/check-release-version.sh client "${RELEASE_TAG}" "${package_version}" >/dev/null
          cargo build --locked --release -p metrune --target "${{ matrix.target }}"
      - name: Smoke-test the native binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="$("${{ matrix.source }}" --version 2>/dev/null)"
          echo "$version"
          grep -F "${RELEASE_VERSION}" <<<"$version"
          "${{ matrix.source }}" --help
      - name: Prove the native credential store is used
        # Installation tokens must land in the operating system's credential
        # store, not the 0600 fallback file. The store degrades silently, so
        # this asserts the storage mode rather than trusting a successful
        # write. RELEASING.md makes it a gate for leaving experimental tier.
        #
        # Skipped on Linux: hosted runners have no D-Bus secret service, so
        # falling back there is correct behaviour, and scripts/test-e2e.sh
        # already covers the fallback path.
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo test --locked -p metrune --target "${{ matrix.target }}" \
            -- --ignored --exact \
            credentials::tests::an_installation_token_round_trips_through_the_native_keyring

      - name: Name release artifact
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      # The release job disables setup-node's package cache explicitly. Keep
      # this scoped ignore because zizmor cannot distinguish that from its
      # cache-enabled form in a publishing workflow.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: ''
      - name: Verify the committed third-party notices
        run: |
          set -euo pipefail
          npm ci --omit=dev --omit=optional --prefix web
          python3 scripts/generate-notices.py --output /tmp/metrune-NOTICE
          cmp -s NOTICE /tmp/metrune-NOTICE || {
            echo "NOTICE is stale; run make notices and commit the generated file" >&2
            diff -u NOTICE /tmp/metrune-NOTICE || true
            exit 1
          }
          cp NOTICE artifacts/NOTICE
      - name: Generate checksums and release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum artifacts/metrune-* > artifacts/SHA256SUMS
          cat > artifacts/RELEASE_MANIFEST.txt <<EOF
          version: ${RELEASE_VERSION}
          tag: ${RELEASE_TAG}
          commit: ${GITHUB_SHA}
          clients:
            - artifact: metrune-linux-x86_64
              platform: Linux x86_64
              tier: supported
            - artifact: metrune-windows-x86_64.exe
              platform: Windows x86_64
              tier: experimental
            - artifact: metrune-macos-x86_64
              platform: Intel macOS
              tier: experimental
            - artifact: metrune-macos-arm64
              platform: Apple Silicon macOS
              tier: experimental
          EOF
      - name: Build the machine-readable client manifest
        shell: bash
        env:
          # Releases fail closed until the signing key and explicit version
          # floor are configured; a publishable client manifest is always
          # signed and verifiable by clients that pin the public key.
          METRUNE_RELEASE_SIGNING_KEY: ${{ secrets.METRUNE_RELEASE_SIGNING_KEY }}
          MINIMUM_CLIENT_VERSION: ${{ vars.MINIMUM_CLIENT_VERSION }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${METRUNE_RELEASE_SIGNING_KEY}" || {
            echo "METRUNE_RELEASE_SIGNING_KEY must be configured for release builds" >&2
            exit 1
          }
          test -n "${MINIMUM_CLIENT_VERSION}" || {
            echo "MINIMUM_CLIENT_VERSION must be configured explicitly" >&2
            exit 1
          }
          client_version="${RELEASE_VERSION}"
          minimum_version="${MINIMUM_CLIENT_VERSION#v}"
          bash scripts/check-release-version.sh client "client-v${minimum_version}" "${minimum_version}" >/dev/null
          # Generated by the released binary itself, so the manifest can never
          # drift from the format this version's `metrune update` parses.
          chmod +x artifacts/metrune-linux-x86_64
          (cd artifacts && ./metrune-linux-x86_64 release manifest \
            --version "${client_version}" \
            --minimum-version "${minimum_version}" \
            --checksums SHA256SUMS \
            --upstream-base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --output client-manifest.json)
      - name: Attest release binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/metrune-*
      - name: Validate a resumable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/release-draft.sh validate
      - name: Recheck the release tag before creating the draft
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/assert-release-tag-available.sh "$RELEASE_TAG"
      # Upload into a commit-bound draft first. A failed upload can be resumed;
      # the Git tag is created only after every expected asset is verified.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Verify and publish the complete release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          bash scripts/release-draft.sh verify \
            NOTICE RELEASE_MANIFEST.txt SHA256SUMS client-manifest.json \
            metrune-linux-x86_64 metrune-windows-x86_64.exe \
            metrune-macos-x86_64 metrune-macos-arm64
          bash scripts/release-draft.sh publish
