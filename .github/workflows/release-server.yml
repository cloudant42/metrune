name: Release server images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # The committed workspace version is the only place the release number is
  # written. A manual run derives the tag from it and the manifest job creates
  # that tag. The operator never types or pushes a version tag, so the tag can
  # never disagree with the shipped images.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the release tag
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
            [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "manual server releases must run against ${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          package_version="$(bash scripts/resolve-release-version.sh server)"
          tag="server-v${package_version}"
          version="$(bash scripts/check-release-version.sh server "$tag" "$package_version")"
          # Re-releasing an existing version would move a tag that published
          # image digests already point at. Transport or auth failures also
          # stop the release rather than looking like a 404.
          bash scripts/assert-release-tag-available.sh "$tag"
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the release commit's CI and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release-checks.py

  images:
    needs: [version, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: crates/metrune-api/Dockerfile
          - component: web
            dockerfile: web/Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image names
        id: meta
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.component }}"
          {
            echo "version=${VERSION}"
            echo "image=${image}"
            echo "candidate=${image}:${VERSION}-candidate-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build under a temporary tag first. The production version tag is only
      # promoted after the exact pushed digest passes Trivy.
      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # The release manifest only needs the explicit digest artifacts below;
          # do not upload an additional build-record artifact for every image.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.candidate }}
          labels: |
            org.opencontainers.image.title=metrune-${{ matrix.component }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.candidate }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record the published digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p digests
          printf '%s:%s@%s\n' "$IMAGE" "$VERSION" "$DIGEST" > "digests/${COMPONENT}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.component }}
          path: digests/${{ matrix.component }}.txt

  manifest:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: ''
      - name: Verify the committed third-party notices
        run: |
          set -euo pipefail
          npm ci --omit=dev --omit=optional --prefix web
          python3 scripts/generate-notices.py --output /tmp/metrune-NOTICE
          cmp -s NOTICE /tmp/metrune-NOTICE || {
            echo "NOTICE is stale; run make notices and commit the generated file" >&2
            diff -u NOTICE /tmp/metrune-NOTICE || true
            exit 1
          }

      # Operators pin these digests in compose.production.yaml before rollout.
      - name: Build the server image manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "version: ${VERSION}"
            echo "tag: ${TAG}"
            echo "commit: ${GITHUB_SHA}"
            echo "images:"
            sed 's/^/  - /' digests/*.txt
          } > SERVER_IMAGE_MANIFEST.txt
          cat SERVER_IMAGE_MANIFEST.txt

      - name: Validate a resumable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/release-draft.sh validate
      - name: Recheck the release tag before creating the draft
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/assert-release-tag-available.sh "$RELEASE_TAG"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            NOTICE
            SERVER_IMAGE_MANIFEST.txt
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Verify the complete release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/release-draft.sh verify NOTICE SERVER_IMAGE_MANIFEST.txt

      # Neither final version tag exists until both matrix legs have built,
      # passed Trivy, emitted provenance, and reached this downstream job.
      - name: Promote the reviewed image digests to version tags
        run: |
          set -euo pipefail
          inspect_error="$(mktemp)"
          trap 'rm -f "$inspect_error"' EXIT
          while IFS= read -r published; do
            destination="${published%@*}"
            image="${destination%:*}"
            digest="${published##*@}"
            source="${image}@${digest}"
            docker buildx imagetools inspect "$source" >/dev/null
            if manifest="$(docker buildx imagetools inspect "$destination" --format '{{json .Manifest}}' 2>"$inspect_error")"; then
              current="$(jq -r '.digest // empty' <<<"$manifest")"
              [[ -n "$current" ]] || {
                echo "could not resolve the existing digest for $destination" >&2
                exit 1
              }
              [[ "$current" == "$digest" ]] || {
                echo "$destination already points at $current, refusing to move it to $digest" >&2
                exit 1
              }
              echo "$destination already points at the intended digest"
            elif grep -Eqi 'manifest unknown|name unknown|not found|no such manifest' "$inspect_error"; then
              docker buildx imagetools create --tag "$destination" "$source"
            else
              cat "$inspect_error" >&2
              echo "could not determine whether $destination already exists" >&2
              exit 1
            fi
          done < <(sort digests/*.txt)

      - name: Publish the verified release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/release-draft.sh publish
