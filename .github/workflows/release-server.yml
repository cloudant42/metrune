name: Release server images

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Server version or server-vX.Y.Z tag (defaults to the current ref name)"
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Wait for the release commit's CI and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release-checks.py

  images:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: crates/metrune-api/Dockerfile
          - component: web
            dockerfile: web/Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The dispatch input is passed through the environment, never
      # interpolated into the script body.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION}"
          if [ -z "$raw" ]; then raw="${GITHUB_REF_NAME}"; fi
          if [[ "$raw" == server-v* ]]; then
            tag="$raw"
          else
            tag="server-v${raw#v}"
          fi
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          version="$(bash scripts/check-release-version.sh server "$tag" "$package_version")"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.component }}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "image=${image}"
            echo "candidate=${image}:${version}-candidate-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build under a temporary tag first. The production version tag is only
      # promoted after the exact pushed digest passes Trivy.
      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          # The release manifest only needs the explicit digest artifacts below;
          # do not upload an additional build-record artifact for every image.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.version.outputs.candidate }}
          labels: |
            org.opencontainers.image.title=metrune-${{ matrix.component }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.version.outputs.candidate }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Promote the scanned digest to the release tag
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record the published digest
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p digests
          printf '%s:%s@%s\n' "$IMAGE" "$VERSION" "$DIGEST" > "digests/${COMPONENT}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.component }}
          path: digests/${{ matrix.component }}.txt

  manifest:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: digests
          pattern: image-digest-*
          merge-multiple: true

      # Operators pin these digests in compose.production.yaml before rollout.
      - name: Build the server image manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION}"
          if [ -z "$raw" ]; then raw="${GITHUB_REF_NAME}"; fi
          if [[ "$raw" == server-v* ]]; then tag="$raw"; else tag="server-v${raw#v}"; fi
          version="${tag#server-v}"
          {
            echo "version: ${version}"
            echo "tag: ${tag}"
            echo "commit: ${GITHUB_SHA}"
            echo "images:"
            sed 's/^/  - /' digests/*.txt
          } > SERVER_IMAGE_MANIFEST.txt
          cat SERVER_IMAGE_MANIFEST.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SERVER_IMAGE_MANIFEST.txt
