name: Security scans

on:
  pull_request:
  # The release gate consumes these checks from the release commit on main,
  # so a release can only publish a commit that already passed the full scan
  # matrix.
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
      # .cargo/audit.toml suppresses one advisory that affects RSA private-key
      # operations. OIDC compiles the crate but Metrune uses it only to verify
      # an IdP's public-key signature. Keep both the dependency path and
      # production source use narrow, or fail rather than silently broadening
      # the suppression.
      - name: Verify the RSA advisory remains verification-only
        run: |
          rsa_graph="$(cargo tree --workspace --target all --invert rsa)"
          printf '%s\n' "$rsa_graph"
          if [ "$(printf '%s\n' "$rsa_graph" | wc -l | tr -d ' ')" != "3" ] \
            || ! grep -q '^rsa v' <<<"$rsa_graph" \
            || ! grep -q 'openidconnect v' <<<"$rsa_graph" \
            || ! grep -q 'metrune-api v' <<<"$rsa_graph"; then
            echo "::error::RUSTSEC-2023-0071 is suppressed only for rsa -> openidconnect -> metrune-api."
            exit 1
          fi
          if grep -nE 'CoreRsaPrivateSigningKey|RsaPrivateKey|PrivateSigningKey' \
            crates/metrune-api/src/oidc.rs; then
            echo "::error::production OIDC code now uses an RSA private-key API; RUSTSEC-2023-0071 can no longer be suppressed."
            exit 1
          fi
          echo "rsa remains confined to public-key OIDC verification."

  # THIRD_PARTY_NOTICES.md commits maintainers to reviewing dependency licenses
  # for Apache-2.0 compatibility. Enforced here so an incompatible dependency
  # fails the pull request that adds it rather than surfacing at release.
  rust-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny check licenses sources bans

  # The dashboard's licenses come from the installed tree, so the notice
  # generator needs node_modules. This also proves the generator still runs.
  npm-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Production-only: the runner image ships just the deps Next traces into
      # .next/standalone, so dev tooling is not distributed and must not appear
      # in NOTICE.
      - run: npm ci --omit=dev --omit=optional
        working-directory: web
      # Overwriting NOTICE here would hide the drift this job exists to catch:
      # the release workflows refuse to publish a stale file, so a pull request
      # that moves a dependency must fail here rather than at release time.
      - name: Verify the committed third-party notices
        run: |
          set -euo pipefail
          python3 scripts/generate-notices.py --output /tmp/metrune-NOTICE
          cmp -s NOTICE /tmp/metrune-NOTICE || {
            echo "::error::NOTICE is stale; run make notices and commit the generated file"
            diff -u NOTICE /tmp/metrune-NOTICE || true
            exit 1
          }
      - name: Report licenses that still need their text
        run: |
          if grep -q "^## Action required before release" NOTICE; then
            echo "::warning::NOTICE lists dependencies whose license text must be added before release"
            sed -n '/^## Action required before release/,/^## /p' NOTICE | head -40
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: third-party-notices
          path: NOTICE

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  # Trivy's misconfiguration scanner does not understand GitHub Actions
  # workflows, so they are audited separately.
  github-actions-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint workflow syntax and expressions
        run: |
          curl -fsSL -o actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash actionlint.bash
          ./actionlint -color
      - name: Audit workflows for supply-chain weaknesses
        uses: zizmorcore/zizmor-action@5ca5fc7a4779c5263a3ffa0e1f693009994446d1 # v0.1.2
        with:
          advanced-security: false
          persona: regular
          # Fail the build on real weaknesses; informational style findings
          # (for example "use `gh release` instead of an action") do not block.
          min-severity: low

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan dependencies, Dockerfiles, and repository configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build -f crates/metrune-api/Dockerfile -t metrune-api:security .
      - name: Build web image
        run: docker build -f web/Dockerfile -t metrune-web:security .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metrune-api:security
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metrune-web:security
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1
