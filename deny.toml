# Dependency license and source policy for the Rust workspace.
#
# THIRD_PARTY_NOTICES.md commits release maintainers to reviewing dependency
# licenses for compatibility with Metrune's Apache-2.0 license. This enforces
# that continuously instead of at release time, so an incompatible dependency
# is caught in the pull request that introduces it.
#
# Vulnerability scanning stays in `cargo audit` (see .github/workflows/
# security.yml) rather than being duplicated here.

[graph]
all-features = true

[licenses]
# Every license permitted in the dependency graph. Adding one is a deliberate
# decision: a copyleft term here could oblige Metrune, or a downstream operator
# redistributing it, to publish source they did not intend to.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # The Mozilla CA root bundle shipped by webpki-roots. A data license, not a
    # code one, and permissive: redistribution carries no source obligation.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft. Permitted to depend on, but modifying an MPL file
    # obliges publishing that file, and its text must ship in NOTICE.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
# Keeping a license allowed that nothing currently uses is intentional: the
# list is the policy, not an inventory of today's graph.
unused-allowed-license = "allow"

# Metrune's own crates are not published to crates.io and do not need to
# satisfy the policy applied to third-party code.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# Crates that must never enter the graph regardless of license.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
