# cargo-audit configuration.
#
# cargo-audit scans Cargo.lock, which records every package in the resolution
# graph whether or not it is ever compiled. Optional dependencies of our
# dependencies appear there even when the feature that would pull them in is
# switched off, so an advisory against one of them is not necessarily an
# advisory against anything we ship.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack, a timing sidechannel in `rsa`.
    #
    # `rsa` is compiled solely through `openidconnect`. Production Metrune uses
    # the identity provider's public JWKS to verify ID-token signatures; it
    # neither loads an RSA private key nor performs an RSA signing/decryption
    # operation. The advisory leaks private keys through the timing of those
    # private-key operations, so public-key verification is outside its impact.
    # The signed mock provider does use a test-only private fixture.
    #
    # There is no fixed release to upgrade to, so this cannot be resolved by
    # bumping. The `rust-audit` job fails if another compiled dependency starts
    # using `rsa`, or if production OIDC code starts using a private-key API.
    # Either change invalidates this narrowly scoped suppression.
    "RUSTSEC-2023-0071",
]
