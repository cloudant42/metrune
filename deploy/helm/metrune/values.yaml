api:
  image: metrune/api:0.1.0
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
web:
  image: metrune/web:0.1.0
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  databaseUrlSecret: metrune-postgres
  clickhouseSecret: metrune-clickhouse
  dashboardTokenSecret: metrune-dashboard
  vaultKeySecret: metrune-vault
  environment: production
  publicApiUrl: https://metrune.example.com
  clientReleaseBaseUrl: ""
  # Enable only when the ingress controller overwrites X-Forwarded-For.
  trustProxyHeaders: true
  # Per-replica request budgets; 0 disables a limit. See docs/AUTHORIZATION.md.
  rateLimits:
    ENROLL_PER_MINUTE: 10
    LOGIN_PER_MINUTE: 30
    PROVISION_PER_MINUTE: 20
    INGEST_PER_MINUTE: 60
    ANALYTICS_PER_MINUTE: 120
    ENROLLMENT_CODES_PER_HOUR: 20

ingress:
  enabled: false
  className: nginx
  host: metrune.example.com
  tlsSecret: metrune-tls
