apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: metrune-api }
  template:
    metadata:
      labels: { app: metrune-api }
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.config.databaseUrlSecret }}, key: url } }
            - name: CLICKHOUSE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.config.clickhouseSecret }}, key: url } }
            - name: CLICKHOUSE_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.config.clickhouseSecret }}, key: username } }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.config.clickhouseSecret }}, key: password } }
          readinessProbe: { httpGet: { path: /v1/readyz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /v1/healthz, port: http }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: { app: metrune-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
