apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: metrune-api }
  template:
    metadata:
      labels: { app: metrune-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
          volumeMounts:
            - name: vault-key
              mountPath: /var/lib/metrune/secrets
              readOnly: true
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.config.databaseUrlSecret }}, key: url } }
            - name: CLICKHOUSE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.config.clickhouseSecret }}, key: url } }
            - name: CLICKHOUSE_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.config.clickhouseSecret }}, key: username } }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.config.clickhouseSecret }}, key: password } }
            - name: METRUNE_ENV
              value: {{ .Values.config.environment | quote }}
            - name: METRUNE_PUBLIC_API_URL
              value: {{ .Values.config.publicApiUrl | quote }}
            - name: METRUNE_SECRETS_KEY_FILE
              value: /var/lib/metrune/secrets/master.key
            {{- /* Address-keyed rate limits use X-Forwarded-For only when the
                   ingress in front of the API overwrites it. */}}
            - name: METRUNE_TRUST_PROXY_HEADERS
              value: {{ .Values.config.trustProxyHeaders | quote }}
            {{- range $name, $value := .Values.config.rateLimits }}
            - name: METRUNE_RATE_LIMIT_{{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe: { httpGet: { path: /v1/readyz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /v1/healthz, port: http }, initialDelaySeconds: 10 }
      volumes:
        - name: vault-key
          secret:
            secretName: {{ .Values.config.vaultKeySecret }}
            items:
              - key: master.key
                path: master.key
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: { app: metrune-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
