services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrune -d metrune"]

  clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
    healthcheck:
      test:
        ["CMD", "clickhouse-client", "--user", "metrune", "--password", "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}", "--query", "SELECT 1"]

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      METRUNE_ENV: production
      METRUNE_PUBLIC_API_URL: ${METRUNE_PUBLIC_API_URL:?METRUNE_PUBLIC_API_URL must be set to an HTTPS URL}
      METRUNE_BOOTSTRAP_EMAIL: ${METRUNE_BOOTSTRAP_EMAIL:-}
      METRUNE_BOOTSTRAP_PASSWORD: ${METRUNE_BOOTSTRAP_PASSWORD:-}
      METRUNE_CLASSIFIER_CONFIG_VERSION: ${METRUNE_CLASSIFIER_CONFIG_VERSION:-production-1}
      METRUNE_TRUST_PROXY_HEADERS: ${METRUNE_TRUST_PROXY_HEADERS:-false}
      RUST_LOG: ${RUST_LOG:-metrune_api=info,tower_http=info}
    ports:
      - "${METRUNE_API_BIND_ADDRESS:-127.0.0.1}:8080:8080"

  web:
    environment:
      METRUNE_ENV: production
      METRUNE_DASHBOARD_TOKEN: ${METRUNE_DASHBOARD_TOKEN:-}
      METRUNE_PUBLIC_API_URL: ${METRUNE_PUBLIC_API_URL:?METRUNE_PUBLIC_API_URL must be set to an HTTPS URL}
      METRUNE_CLIENT_RELEASE_BASE_URL: ${METRUNE_CLIENT_RELEASE_BASE_URL:-}
    ports:
      - "${METRUNE_WEB_BIND_ADDRESS:-127.0.0.1}:3001:3000"

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    ports:
      - "${METRUNE_GRAFANA_BIND_ADDRESS:-127.0.0.1}:3002:3000"
